          set -euo pipefail
          git fetch --no-tags https://github.com/stablyai/orca.git \
            "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG" \
            "refs/tags/$TERMINAL_MODE_METADATA_LEGACY_TAG:refs/tags/$TERMINAL_MODE_METADATA_LEGACY_TAG"
          test "$(git rev-parse "$UPSTREAM_TAG^{commit}")" = "$UPSTREAM_SHA"
          test "$(git rev-parse "$TERMINAL_MODE_METADATA_LEGACY_TAG^{commit}")" = \
            "$TERMINAL_MODE_METADATA_LEGACY_SHA"
      - run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          tests/e2e/cross-version-wire/cross-version-terminal-wire.unit.test.ts
        env:
          ORCA_CROSS_VERSION_BASELINE_REF: ${{ needs.candidate.outputs.upstream_tag }}

  mobile-checks:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm install --frozen-lockfile
        working-directory: mobile
      - run: pnpm typecheck
        working-directory: mobile
      - run: pnpm test
        working-directory: mobile
      - run: pnpm lint
        working-directory: mobile

  desktop:
    needs: candidate
    name: Desktop ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        if: matrix.platform != 'macos'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile
      - name: Install macOS release dependencies
        if: matrix.platform == 'macos'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install:release
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool rpm
      - name: Build desktop application
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Package unsigned Windows client
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/scripts/fork-electron-builder-config.cjs --win --x64 --publish never
      - name: Package Linux x64 client
        if: matrix.platform == 'linux-x64'
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/scripts/fork-electron-builder-config.cjs --linux AppImage deb rpm --x64 --publish never
      - name: Package Linux arm64 client
        if: matrix.platform == 'linux-arm64'
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          ORCA_LINUX_ARM64_RELEASE=1 pnpm exec electron-builder --config config/scripts/fork-electron-builder-config.cjs --linux AppImage deb rpm --arm64 --publish never
      - name: Package ad-hoc macOS clients
        if: matrix.platform == 'macos'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_NAME: '-'
          ORCA_COMPUTER_MACOS_SIGN_IDENTITY: '-'
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/scripts/fork-electron-builder-config.cjs --mac --publish never
      - name: Verify complete ad-hoc macOS signatures
        if: matrix.platform == 'macos'
        run: node .github/scripts/verify-fork-macos-signatures.mjs dist
      - name: Stage desktop release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          case "${{ matrix.platform }}" in
            windows-x64) cp dist/orca-windows-setup.exe dist/orca-windows-setup.exe.blockmap dist/latest.yml release-assets/ ;;
            linux-x64) cp dist/*.AppImage dist/*.deb dist/*.rpm dist/latest-linux.yml release-assets/ ;;
            linux-arm64) cp dist/*.AppImage dist/*.deb dist/*.rpm dist/latest-linux-arm64.yml release-assets/ ;;
            macos) cp dist/orca-macos-*.dmg dist/Orca-*-mac.zip dist/latest-mac.yml release-assets/ ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  android:
    needs: candidate
    name: Mobile Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: npx expo prebuild --platform android --no-install
      - name: Remove template debug signing from release build
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'android/app/build.gradle'
          const source = fs.readFileSync(path, 'utf8')
          const signingLine = /^([ \t]*)signingConfig signingConfigs\.debug$/gm
          const matches = [...source.matchAll(signingLine)]
          if (matches.length !== 2) {
            throw new Error(`expected debug and release signing lines, got ${matches.length}`)
          }
          const releaseIndex = matches[1].index
          const output = `${source.slice(0, releaseIndex)}${matches[1][1]}// Signed in the isolated release-signing job.${source.slice(releaseIndex + matches[1][0].length)}`
          fs.writeFileSync(path, output)
          NODE
      - run: cd android && ./gradlew assembleRelease
      - name: Stage unsigned APK
        run: |
          set -euo pipefail
          version="$(node -p "require('./app.json').expo.version")"
          apk="$(find android/app/build/outputs/apk/release -name '*-unsigned.apk' -print -quit)"
          test -n "$apk"
          mkdir -p ../release-assets
          cp "$apk" "../release-assets/orca-mobile-android-${version}-unsigned.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-signing-input
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  android-sign:
    needs:
      - candidate
      - android
    name: Sign Mobile Android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      certificate_sha256: ${{ steps.sign.outputs.certificate_sha256 }}
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v8
        with:
          name: android-signing-input
          path: unsigned-apk
      - name: Sign and verify APK
        id: sign
        env:
          FORK_ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.FORK_ANDROID_RELEASE_KEYSTORE_BASE64 }}
          FORK_ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.FORK_ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FORK_ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$FORK_ANDROID_RELEASE_KEYSTORE_PASSWORD"
          keystore="$RUNNER_TEMP/orca-fork-release.p12"
          printf '%s' "$FORK_ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode >"$keystore"
          chmod 600 "$keystore"
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f -print | sort -V | tail -n 1)"
          input="$(find unsigned-apk -name 'orca-mobile-android-*-unsigned.apk' -print -quit)"
          test -x "$apksigner"
          test -n "$input"
          mkdir release-assets
          output="release-assets/$(basename "${input%-unsigned.apk}").apk"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias orca-fork-release \
            --ks-pass env:FORK_ANDROID_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:FORK_ANDROID_RELEASE_KEYSTORE_PASSWORD \
            --out "$output" \
            "$input"
          "$apksigner" verify --verbose "$output"
          certificate_details="$("$apksigner" verify --verbose --print-certs "$output")"
          printf '%s\n' "$certificate_details"
          certificate_sha256="$(
            sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*//p' <<<"$certificate_details" |
              tr -d '[:space:]:' |
              tr '[:upper:]' '[:lower:]'
          )"
          certificate_dn="$(
            sed -nE 's/^.*certificate DN:[[:space:]]*//p' <<<"$certificate_details" |
              sed -E 's/[[:space:]]*,[[:space:]]*/,/g'
          )"
          expected_certificate_sha256="$(
            keytool -exportcert \
              -keystore "$keystore" \
              -storetype PKCS12 \
              -storepass:env FORK_ANDROID_RELEASE_KEYSTORE_PASSWORD \
              -alias orca-fork-release |
              sha256sum |
              awk '{print $1}'
          )"
          [[ "$certificate_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_certificate_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$certificate_sha256" = "$expected_certificate_sha256"
          test "$certificate_sha256" != "$EXPO_DEBUG_CERTIFICATE_SHA256"
          grep -Eq '(^|,)CN=Orca Fork Release(,|$)' <<<"$certificate_dn"
          grep -Eq '(^|,)OU=Mobile(,|$)' <<<"$certificate_dn"
          grep -Eq '(^|,)O=GhostFlying(,|$)' <<<"$certificate_dn"
          grep -Eq '(^|,)C=US(,|$)' <<<"$certificate_dn"
          echo "certificate_sha256=$certificate_sha256" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  ios:
    needs: candidate
    name: Mobile iOS unsigned
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx expo prebuild --platform ios --no-install
      - run: npx pod-install ios
      - name: Build unsigned IPA
        run: bash scripts/build-unsigned-ios.sh
      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-ios
          path: mobile/build/unsigned-ios/output/*.ipa
          if-no-files-found: error
          retention-days: 7

  release-bundle:
    needs:
      - candidate
      - desktop
      - android-sign
      - ios
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.assets.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: fork-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release assets
        id: assets
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          ANDROID_RELEASE_CERTIFICATE_SHA256: ${{ needs.android-sign.outputs.certificate_sha256 }}
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.candidate.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          export DESKTOP_VERSION="$(node -p "require('./package.json').version")"
          export MOBILE_VERSION="$(node -p "require('./mobile/app.json').expo.version")"
          export ANDROID_VERSION_CODE="$(node -p "require('./mobile/app.json').expo.android.versionCode")"
          export IOS_BUILD_NUMBER="$(node -p "require('./mobile/app.json').expo.ios.buildNumber")"
          node .github/scripts/fork-release-assets.mjs release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-complete
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  finalize:
    needs:
      - candidate
      - maintenance-contract
      - lint
      - typecheck
      - test
      - cross-version-wire
      - mobile-checks
      - desktop
      - android
      - android-sign
      - ios
      - release-bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: fork-release-complete
          path: release-assets
      - name: Verify trusted release bundle
        env:
          ANDROID_RELEASE_CERTIFICATE_SHA256: ${{ needs.android-sign.outputs.certificate_sha256 }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.release-bundle.outputs.release_tag }}
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.candidate.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          jq -e \
            --arg candidate "$CANDIDATE_SHA" \
            --arg tag "$RELEASE_TAG" \
            --arg upstream_sha "$UPSTREAM_SHA" \
            --arg upstream_tag "$UPSTREAM_TAG" \
            --arg android_certificate_sha256 "$ANDROID_RELEASE_CERTIFICATE_SHA256" \
            '.candidateSha == $candidate and .releaseTag == $tag and .upstream.sha == $upstream_sha and .upstream.tag == $upstream_tag and .androidSigning.certificateSha256 == $android_certificate_sha256' \
            release-assets/build-metadata.json >/dev/null
          (cd release-assets && sha256sum --check checksums.txt)
      - name: Revalidate exact remote refs
        id: refs
        env:
          ANCHOR_SHA: ${{ needs.candidate.outputs.anchor_sha }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          SOURCE_ANCHOR_SHA: ${{ needs.candidate.outputs.source_anchor_sha }}
          SOURCE_FORK_SHA: ${{ needs.candidate.outputs.source_fork_sha }}
          SOURCE_PREVIEW_SHA: ${{ needs.candidate.outputs.source_preview_sha }}
          TRANSACTION_KIND: ${{ needs.candidate.outputs.transaction_kind }}
          HOTFIX_SOURCE_REF: ${{ needs.candidate.outputs.hotfix_source_ref }}
          HOTFIX_SOURCE_SHA: ${{ needs.candidate.outputs.hotfix_source_sha }}
        run: |
          set -euo pipefail
          remote_ref() { git ls-remote origin "refs/heads/$1" | awk '{print $1}'; }
          current_anchor="$(remote_ref "$ANCHOR_BRANCH")"
          current_fork="$(remote_ref "$FORK_BRANCH")"
          current_preview="$(remote_ref "$PREVIEW_BRANCH")"
          if [[ "$TRANSACTION_KIND" = upstream-release ]]; then
            test "$current_preview" = "$CANDIDATE_SHA"
          elif [[ "$TRANSACTION_KIND" = fork-hotfix ]]; then
            test "$(remote_ref "$HOTFIX_CANDIDATE_BRANCH")" = "$CANDIDATE_SHA"
            test "$(remote_ref "$HOTFIX_SOURCE_REF")" = "$HOTFIX_SOURCE_SHA"
          else
            echo "::error::Unsupported transaction kind: $TRANSACTION_KIND"
            exit 1
          fi
          if [[ "$current_fork" = "$SOURCE_FORK_SHA" && "$current_anchor" = "$SOURCE_ANCHOR_SHA" ]]; then
            if [[ "$TRANSACTION_KIND" = fork-hotfix ]]; then
              test "$current_preview" = "$SOURCE_PREVIEW_SHA"
              test "$current_preview" = "$SOURCE_FORK_SHA"
            fi
            echo "state=pending" >>"$GITHUB_OUTPUT"
          elif [[ "$current_fork" = "$CANDIDATE_SHA" && "$current_anchor" = "$ANCHOR_SHA" ]]; then
            test "$current_preview" = "$CANDIDATE_SHA"
            echo "state=promoted" >>"$GITHUB_OUTPUT"
          else
            echo "::error::Production refs changed while the candidate was building."
            exit 1
          fi
      - name: Create or refresh draft Release
        id: release
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-bundle.outputs.release_tag }}
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.candidate.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/fork-release-notes.md"
          cat >"$notes" <<EOF
          Automated fork build based on upstream $UPSTREAM_TAG ($UPSTREAM_SHA).

          Candidate: $CANDIDATE_SHA

          Desktop and mobile artifacts are published together. They are not uploaded to any app store. macOS is ad-hoc signed and may require a Gatekeeper override. The Android APK uses the fork release key; APKs from fork releases before this key was introduced must be uninstalled once before installation. The iOS IPA is unsigned and must be re-signed before installation. Verify downloads with checksums.txt and build-metadata.json.
          EOF
          release_json="$(
            page=1
            while :; do
              values="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page")"
              jq -c '.[]' <<<"$values"
              [[ "$(jq 'length' <<<"$values")" -lt 100 ]] && break
              page=$((page + 1))
            done | jq -sc --arg tag "$RELEASE_TAG" \
              '[.[] | select(.tag_name == $tag)] | if length == 0 then empty elif length == 1 then .[0] else error("duplicate release tag") end'
          )"
          if [[ -z "$release_json" ]]; then
            release_json="$(jq -n \
              --arg tag "$RELEASE_TAG" \
              --arg target "$CANDIDATE_SHA" \
              --arg name "Orca $UPSTREAM_TAG fork build" \
              --rawfile body "$notes" \
              '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: true, prerelease: true, make_latest: "false"}' | \
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input -)"
          fi
          test "$(jq -r .tag_name <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r .prerelease <<<"$release_json")" = true
          release_target="$(jq -r .target_commitish <<<"$release_json")"
          if [[ "$release_target" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Release target $release_target does not match $CANDIDATE_SHA."
            exit 1
          fi
          release_id="$(jq -r .id <<<"$release_json")"
          draft="$(jq -r .draft <<<"$release_json")"
          if [[ "$draft" = true ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --paginate --jq '.[].id' |
            while read -r asset_id; do
              [[ -n "$asset_id" ]] || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          elif [[ "$draft" != false ]]; then
            echo "::error::Release draft state is invalid."
            exit 1
          fi
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"
          echo "was_draft=$draft" >>"$GITHUB_OUTPUT"
      - name: Verify uploaded assets
        env:
          ANDROID_RELEASE_CERTIFICATE_SHA256: ${{ needs.android-sign.outputs.certificate_sha256 }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-bundle.outputs.release_tag }}
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.candidate.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          remote_dir="$RUNNER_TEMP/remote-release-assets"
          mkdir "$remote_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote_dir"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort >"$RUNNER_TEMP/local-assets.txt"
          find "$remote_dir" -maxdepth 1 -type f -printf '%f\n' | sort >"$RUNNER_TEMP/remote-assets.txt"
          diff -u "$RUNNER_TEMP/local-assets.txt" "$RUNNER_TEMP/remote-assets.txt"
          jq -e \
            --arg candidate "$CANDIDATE_SHA" \
            --arg tag "$RELEASE_TAG" \
            --arg upstream_sha "$UPSTREAM_SHA" \
            --arg upstream_tag "$UPSTREAM_TAG" \
            --arg android_certificate_sha256 "$ANDROID_RELEASE_CERTIFICATE_SHA256" \
            '.candidateSha == $candidate and .releaseTag == $tag and .upstream.sha == $upstream_sha and .upstream.tag == $upstream_tag and .androidSigning.certificateSha256 == $android_certificate_sha256' \
            "$remote_dir/build-metadata.json" >/dev/null
          (cd "$remote_dir" && sha256sum --check checksums.txt)
      - name: Atomically promote candidate
        if: steps.refs.outputs.state == 'pending'
        env:
          ANCHOR_SHA: ${{ needs.candidate.outputs.anchor_sha }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          FORK_MAINTENANCE_SSH_KEY: ${{ secrets.FORK_MAINTENANCE_SSH_KEY }}
          SOURCE_ANCHOR_SHA: ${{ needs.candidate.outputs.source_anchor_sha }}
          SOURCE_FORK_SHA: ${{ needs.candidate.outputs.source_fork_sha }}
          SOURCE_PREVIEW_SHA: ${{ needs.candidate.outputs.source_preview_sha }}
          TRANSACTION_KIND: ${{ needs.candidate.outputs.transaction_kind }}
        run: |
          set -euo pipefail
          test -n "$FORK_MAINTENANCE_SSH_KEY"
          if [[ "$TRANSACTION_KIND" = upstream-release ]]; then
            preview_lease_sha="$CANDIDATE_SHA"
          elif [[ "$TRANSACTION_KIND" = fork-hotfix ]]; then
            preview_lease_sha="$SOURCE_PREVIEW_SHA"
          else
            echo "::error::Unsupported transaction kind: $TRANSACTION_KIND"
            exit 1
          fi
          key_path="$RUNNER_TEMP/fork-maintenance-key"
          known_hosts_path="$RUNNER_TEMP/fork-maintenance-known-hosts"
          printf '%s\n' "$FORK_MAINTENANCE_SSH_KEY" >"$key_path"
          chmod 600 "$key_path"
          ssh-keyscan -t ed25519 github.com >"$known_hosts_path" 2>/dev/null
          test "$(ssh-keygen -lf "$known_hosts_path" -E sha256 | awk '{print $2}')" = \
            'SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU'
          GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts_path" \
            git push --atomic \
              --force-with-lease="refs/heads/$FORK_BRANCH:$SOURCE_FORK_SHA" \
              --force-with-lease="refs/heads/$ANCHOR_BRANCH:$SOURCE_ANCHOR_SHA" \
              --force-with-lease="refs/heads/$PREVIEW_BRANCH:$preview_lease_sha" \
              "git@github.com:$GITHUB_REPOSITORY.git" \
              "$CANDIDATE_SHA:refs/heads/$FORK_BRANCH" \
              "$ANCHOR_SHA:refs/heads/$ANCHOR_BRANCH" \
              "$CANDIDATE_SHA:refs/heads/$PREVIEW_BRANCH"
      - name: Publish complete fork Release
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.release-bundle.outputs.release_tag }}
        run: |
          set -euo pipefail
          remote_ref() { git ls-remote origin "refs/heads/$1" | awk '{print $1}'; }
          test "$(remote_ref "$FORK_BRANCH")" = "$CANDIDATE_SHA"
          test "$(remote_ref "$PREVIEW_BRANCH")" = "$CANDIDATE_SHA"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)" = true ]]; then
            jq -n '{draft: false, prerelease: true, make_latest: "false"}' | \
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input - >/dev/null
          fi
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          jq -e \
            --arg candidate "$CANDIDATE_SHA" \
            --arg tag "$RELEASE_TAG" \
            '.draft == false and .prerelease == true and .tag_name == $tag and .target_commitish == $candidate' \
            <<<"$release_json" >/dev/null
          tag_sha=
          for _ in {1..5}; do
            tag_sha="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
            [[ "$tag_sha" = "$CANDIDATE_SHA" ]] && break
            sleep 2
          done
          test "$tag_sha" = "$CANDIDATE_SHA"
