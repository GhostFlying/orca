      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - name: Fetch exact upstream Release baselines
        env:
          TERMINAL_MODE_METADATA_LEGACY_SHA: 6e4f817101daa18d82824b69243d9079baa9c416
