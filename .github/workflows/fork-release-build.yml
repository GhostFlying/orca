name: Fork Release Build

on:
  push:
    branches:
      - candidate/fork-hotfix
      - sync/upstream-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-maintenance
  cancel-in-progress: false

env:
  ANCHOR_BRANCH: upstream-release
  EXPO_DEBUG_CERTIFICATE_SHA256: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
  FORK_BRANCH: fork
  HOTFIX_CANDIDATE_BRANCH: candidate/fork-hotfix
  PREVIEW_BRANCH: sync/upstream-release

jobs:
  candidate:
    if: github.repository == 'GhostFlying/orca'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      anchor_sha: ${{ steps.inspect.outputs.anchor_sha }}
      candidate_sha: ${{ steps.inspect.outputs.candidate_sha }}
      source_anchor_sha: ${{ steps.inspect.outputs.source_anchor_sha }}
      source_fork_sha: ${{ steps.inspect.outputs.source_fork_sha }}
      source_preview_sha: ${{ steps.inspect.outputs.source_preview_sha }}
      state: ${{ steps.refs.outputs.state }}
      transaction_kind: ${{ steps.inspect.outputs.transaction_kind }}
      hotfix_source_ref: ${{ steps.inspect.outputs.hotfix_source_ref }}
      hotfix_source_sha: ${{ steps.inspect.outputs.hotfix_source_sha }}
      upstream_sha: ${{ steps.inspect.outputs.upstream_sha }}
      upstream_tag: ${{ steps.inspect.outputs.upstream_tag }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect candidate transaction
        id: inspect
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node .github/scripts/fork-maintenance-state.mjs inspect-candidate \
            --candidate=HEAD >"$RUNNER_TEMP/fork-candidate.json"
          jq . "$RUNNER_TEMP/fork-candidate.json"
          test "$(jq -r .candidateSha "$RUNNER_TEMP/fork-candidate.json")" = "$EXPECTED_SHA"
          jq -r '
            "anchor_sha=\(.anchorSha)",
            "candidate_sha=\(.candidateSha)",
            "source_anchor_sha=\(.sourceAnchorSha // "")",
            "source_fork_sha=\(.sourceForkSha)",
            "source_preview_sha=\(.sourcePreviewSha // "")",
            "transaction_kind=\(.transactionKind)",
            "hotfix_source_ref=\(.hotfixSourceRef // "")",
            "hotfix_source_sha=\(.hotfixSourceSha // "")",
            "upstream_sha=\(.upstreamSha)",
            "upstream_tag=\(.upstreamTag)"
          ' "$RUNNER_TEMP/fork-candidate.json" >>"$GITHUB_OUTPUT"
          upstream_sha="$(jq -r .upstreamSha "$RUNNER_TEMP/fork-candidate.json")"
          upstream_tag="$(jq -r .upstreamTag "$RUNNER_TEMP/fork-candidate.json")"
          test "v$(git show "$upstream_sha:package.json" | jq -r .version)" = "$upstream_tag"
      - name: Verify current transaction refs
        id: refs
        env:
          ANCHOR_SHA: ${{ steps.inspect.outputs.anchor_sha }}
          CANDIDATE_SHA: ${{ steps.inspect.outputs.candidate_sha }}
          SOURCE_ANCHOR_SHA: ${{ steps.inspect.outputs.source_anchor_sha }}
          SOURCE_FORK_SHA: ${{ steps.inspect.outputs.source_fork_sha }}
          SOURCE_PREVIEW_SHA: ${{ steps.inspect.outputs.source_preview_sha }}
          TRANSACTION_KIND: ${{ steps.inspect.outputs.transaction_kind }}
          HOTFIX_SOURCE_REF: ${{ steps.inspect.outputs.hotfix_source_ref }}
          HOTFIX_SOURCE_SHA: ${{ steps.inspect.outputs.hotfix_source_sha }}
        run: |
          set -euo pipefail
          remote_ref() { git ls-remote origin "refs/heads/$1" | awk '{print $1}'; }
          current_anchor="$(remote_ref "$ANCHOR_BRANCH")"
          current_fork="$(remote_ref "$FORK_BRANCH")"
          current_preview="$(remote_ref "$PREVIEW_BRANCH")"
          case "$TRANSACTION_KIND" in
            upstream-release)
              test "$GITHUB_REF" = "refs/heads/$PREVIEW_BRANCH"
              test "$current_preview" = "$CANDIDATE_SHA"
              ;;
            fork-hotfix)
              test "$GITHUB_REF" = "refs/heads/$HOTFIX_CANDIDATE_BRANCH"
              test "$(remote_ref "$HOTFIX_CANDIDATE_BRANCH")" = "$CANDIDATE_SHA"
              test "$(remote_ref "$HOTFIX_SOURCE_REF")" = "$HOTFIX_SOURCE_SHA"
              git fetch --no-tags origin \
                "+refs/heads/$HOTFIX_SOURCE_REF:refs/remotes/origin/hotfix-source"
              node .github/scripts/fork-maintenance-state.mjs verify-hotfix-candidate \
                --candidate=HEAD --source=refs/remotes/origin/hotfix-source
              ;;
            *) echo "::error::Unsupported transaction kind: $TRANSACTION_KIND"; exit 1 ;;
          esac
          if [[ "$current_fork" = "$SOURCE_FORK_SHA" && "$current_anchor" = "$SOURCE_ANCHOR_SHA" ]]; then
            if [[ "$TRANSACTION_KIND" = fork-hotfix ]]; then
              test "$current_preview" = "$SOURCE_PREVIEW_SHA"
              test "$current_preview" = "$SOURCE_FORK_SHA"
            fi
            echo "state=pending" >>"$GITHUB_OUTPUT"
          elif [[ "$current_fork" = "$CANDIDATE_SHA" && "$current_anchor" = "$ANCHOR_SHA" ]]; then
            test "$current_preview" = "$CANDIDATE_SHA"
            echo "state=promoted" >>"$GITHUB_OUTPUT"
          else
            echo "::error::Candidate source leases no longer match the remote refs."
            exit 1
          fi

  maintenance-contract:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Verify fork maintenance contract
        run: |
          node .github/scripts/fork-maintenance-state.mjs inspect-candidate --candidate=HEAD
          pnpm exec vitest run --config .github/scripts/vitest.config.mjs

  lint:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Repair v1.4.199 localization fixture
        if: needs.candidate.outputs.upstream_sha == '28957d6004dd191b6f0baff493a9fd3d37405d9d'
        env:
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          catalog=src/renderer/src/i18n/en-runtime-required.json
          test "$(git rev-parse "$UPSTREAM_SHA:$catalog")" = \
            47024572e8c7bcb5863942ff8d7d6a6d0df411fb
          test "$(git hash-object "$catalog")" = \
            47024572e8c7bcb5863942ff8d7d6a6d0df411fb
          pnpm run sync:localization-runtime-catalog
          test "$(git hash-object "$catalog")" = \
            a1c33b790bc6f75e7ef0b4a897575c605c959dea
      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile
      - name: Lint full candidate correctness
        run: pnpm exec oxlint --format github
      - name: Enforce fork patch code quality
        env:
          FORK_PATCH_BASE: ${{ needs.candidate.outputs.anchor_sha }}
        run: |
          fork_files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx|*.mts|*.cts) fork_files+=("$file") ;;
            esac
          done < <(git diff --name-only -z --diff-filter=ACMRTUB "$FORK_PATCH_BASE"...HEAD -- src config tests mobile)
          if (( ${#fork_files[@]} > 0 )); then
            pnpm exec oxlint --config config/oxlint-code-quality-native-plugins.json \
              --deny-warnings "${fork_files[@]}"
          fi
          pnpm run check:code-quality:changed -- "$FORK_PATCH_BASE"
          pnpm run check:react-doctor:changed -- "$FORK_PATCH_BASE"
      - name: Verify repository-wide quality contracts
        run: |
          pnpm run check:reliability-gates
          pnpm run check:max-lines-ratchet
          pnpm run check:ts-nocheck-ratchet
          pnpm run check:runtime-electron-ratchet
          pnpm run verify:bundled-skill-guides
          pnpm run verify:skill-bundle-manifest
          pnpm run verify:localization-catalog
          pnpm run verify:localization-runtime-catalog
          pnpm run verify:localization-extraction
          pnpm run verify:localization-coverage

  typecheck:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - run: pnpm typecheck

  test:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        shard_total: [8]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - run: node config/scripts/install-electron-package-binary.mjs
      - name: Install relay integration dependencies
        working-directory: cloud
        run: |
          npx --yes pnpm@10.24.0 --filter '@orca-cloud/relay...' install --frozen-lockfile --ignore-scripts
          npx --yes pnpm@10.24.0 --filter '@orca-cloud/relay^...' build
      - name: Restore upstream workflow fixtures
        env:
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.candidate.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch -- .github/workflows
          fixture_sha="$UPSTREAM_SHA"
          sync_sha="$(git rev-parse "$UPSTREAM_SHA^")"
          # Why: a release cut can sync newer main workflows onto release code; test the pair that shipped together.
          if [[ "$(git show -s --format=%s "$sync_sha")" == "ci: sync release workflows with main for the $UPSTREAM_TAG cut" ]] &&
            [[ -z "$(git diff --name-only "$sync_sha^" "$sync_sha" -- . ':(exclude).github/workflows')" ]]; then
            fixture_sha="$sync_sha^"
          fi
          echo "Upstream workflow fixtures: $fixture_sha"
          git checkout "$fixture_sha" -- .github/workflows
          signing_contract=config/scripts/windows-signing-workflow-contract.test.mjs
          if git cat-file -e "$UPSTREAM_SHA:$signing_contract"; then
            git checkout "$UPSTREAM_SHA" -- "$signing_contract"
          else
            git rm --ignore-unmatch -- "$signing_contract"
          fi
      - name: Repair v1.4.222 release-cut fixtures
        if: needs.candidate.outputs.upstream_sha == '4bb6f2072b07c1f0664b809551f77754700570e4'
        env:
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          relay_gc_fixture=src/main/ssh/ssh-remote-commands.test.ts
          test "$(git rev-parse "$UPSTREAM_SHA:$relay_gc_fixture")" = 76073d24d89f8d5576c066394601c3aa97427d31
          test "$(git hash-object "$relay_gc_fixture")" = 76073d24d89f8d5576c066394601c3aa97427d31
          git apply --unidiff-zero <<'PATCH'
          diff --git a/src/main/ssh/ssh-remote-commands.test.ts b/src/main/ssh/ssh-remote-commands.test.ts
          --- a/src/main/ssh/ssh-remote-commands.test.ts
          +++ b/src/main/ssh/ssh-remote-commands.test.ts
          @@ -282 +282 @@ describe('ssh remote command builders', () => {
          -        expect(entries).toEqual(['relay-0.1.0+aaa', 'relay-0.1.0+bbb'])
          +        expect([...entries].sort()).toEqual(['relay-0.1.0+aaa', 'relay-0.1.0+bbb'])
          PATCH
          test "$(git hash-object "$relay_gc_fixture")" = 9d986cc3c4d5f534c2bdfe3155a894757dc8bb52
      - name: Repair v1.4.220 release-cut fixtures
        if: needs.candidate.outputs.upstream_sha == 'a7927b28ce45cbb044add478d957abe36c99ccd8'
        env:
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          barrier_fixture=config/scripts/ci-background-step-barriers.test.mjs
          cache_warmup_fixture=config/scripts/ci-cache-warmup-workflow.test.mjs
          dependency_cache_fixture=config/scripts/ci-dependency-download-cache.test.mjs
          native_cache_fixture=config/scripts/ci-native-cache.test.mjs
          git_fixture=config/scripts/git-binary-compatibility-workflow.test.mjs
          mobile_shell_fixture=config/scripts/mobile-release-shell-switch-workflow.test.mjs
          node_server_fixture=config/scripts/node-server-change-scope.test.mjs
          pnpm_fixture=config/scripts/ci-pnpm-verification-cache.test.mjs
          pr_parallelism_fixture=config/scripts/pr-workflow-parallelism.test.mjs
          release_e2e_fixture=config/scripts/release-e2e-dispatch-contract.test.mjs
          hostile_hosts_fixture=config/scripts/ssh-hostile-hosts-workflow.test.mjs
          workflow_fixture=.github/workflows/pr.yml
          test "$(git rev-parse "$UPSTREAM_SHA:$barrier_fixture")" = \
            d9dc6332a9f0747d70f7aeaa37110d3c2f0d33ac
          test "$(git hash-object "$barrier_fixture")" = \
            d9dc6332a9f0747d70f7aeaa37110d3c2f0d33ac
          git apply --unidiff-zero <<'PATCH'
          diff --git a/config/scripts/ci-background-step-barriers.test.mjs b/config/scripts/ci-background-step-barriers.test.mjs
          --- a/config/scripts/ci-background-step-barriers.test.mjs
          +++ b/config/scripts/ci-background-step-barriers.test.mjs
          @@ -75 +75 @@ describe('CI background step barriers', () => {
          -    expect(ratchet).toBeLessThan(join)
          +    expect(ratchet).toBeGreaterThan(join)
          PATCH
          test "$(git hash-object "$barrier_fixture")" = \
            d116d79c4189ce069de7b98ae27cd6f961f316d6
          test "$(git rev-parse "$UPSTREAM_SHA:$cache_warmup_fixture")" = \
            74b15e9b2673954d8c31431a17c36643f6ee21a1
          test "$(git hash-object "$cache_warmup_fixture")" = \
            74b15e9b2673954d8c31431a17c36643f6ee21a1
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'config/scripts/ci-cache-warmup-workflow.test.mjs'
          let source = fs.readFileSync(path, 'utf8')
          const replacements = [
            [
              "expect(workflow.on.schedule).toEqual([{ cron: '41 * * * *' }])",
              "expect(workflow.on.schedule).toEqual([{ cron: '41 */6 * * *' }])"
            ],
            [
              "expect(install.with).toEqual({ 'native-runtime': 'node' })",
              "expect(install.with).toEqual({ 'native-runtime': 'node', 'cache-pnpm-store-lookup-only': 'true' })"
            ]
          ]
          for (const [before, after] of replacements) {
            if (source.split(before).length !== 2) throw new Error(`expected one fixture match: ${before}`)
            source = source.replace(before, after)
          }
          fs.writeFileSync(path, source)
          NODE
          test "$(git hash-object "$cache_warmup_fixture")" = \
            8ce6edfcd9568ceb741ce3f4cad63853fd11c446
          test "$(git rev-parse "$UPSTREAM_SHA:$dependency_cache_fixture")" = \
            584c37f6740f757495655ef19d569a724a7e152d
          test "$(git hash-object "$dependency_cache_fixture")" = \
            584c37f6740f757495655ef19d569a724a7e152d
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'config/scripts/ci-dependency-download-cache.test.mjs'
          let source = fs.readFileSync(path, 'utf8')
          const replacements = [
            [
              `expect(step.with.cache).toBe("${'$'}{{ github.event_name != 'pull_request' && 'pnpm' || '' }}")`,
              `expect(step.with.cache).toBe(\n        "${'$'}{{ github.event_name != 'pull_request' && inputs.cache-pnpm-store != 'false' && steps.pnpm-store-mode.outputs.lookup-only != 'true' && 'pnpm' || '' }}"\n      )`
            ],
            [
              "it('restores PR stores except measured Windows mixed installs, without a post-job save', () => {",
              "it('restores PR stores except measured Windows, Linux and macOS installs, without a post-job save', () => {"
            ],
            [
              `    expect(resolve.if).toBe(\n      "github.event_name == 'pull_request' && (runner.os != 'Windows' || runner.arch != 'X64' || !contains(inputs.cache-dependency-path, 'mobile/pnpm-lock.yaml'))"\n    )\n    expect(restore.if).toBe(resolve.if)`,
              `    expect(restore.if).toBe(\n      "github.event_name == 'pull_request' && inputs.cache-pnpm-store != 'false' && !((runner.os == 'Linux' || runner.os == 'macOS') && (runner.arch == 'X64' || runner.arch == 'ARM64') && inputs.cache-dependency-path == 'pnpm-lock.yaml') && (runner.os != 'Windows' || !(runner.arch == 'X64' && contains(inputs.cache-dependency-path, 'mobile/pnpm-lock.yaml')) && !((runner.arch == 'X64' || runner.arch == 'ARM64') && inputs.cache-dependency-path == 'pnpm-lock.yaml'))"\n    )\n    expect(resolve.if).toBe(\n      restore.if +\n        " || (github.event_name != 'pull_request' && inputs.cache-pnpm-store != 'false' && steps.pnpm-store-mode.outputs.lookup-only == 'true')"\n    )`
            ],
            [
              "['Windows x64 root-only PR', 'pull_request', 'Windows', 'X64', false, true, '']",
              "['Windows x64 root-only PR', 'pull_request', 'Windows', 'X64', false, false, '']"
            ],
            [
              `      runner: { os, arch },\n      inputs: {\n        'cache-dependency-path': mixed ? 'pnpm-lock.yaml\\nmobile/pnpm-lock.yaml' : 'pnpm-lock.yaml'\n      },`,
              `      runner: { os, arch },\n      steps: { 'pnpm-store-mode': { outputs: { 'lookup-only': '' } } },\n      inputs: {\n        'cache-pnpm-store': 'true',\n        'cache-dependency-path': mixed ? 'pnpm-lock.yaml\\nmobile/pnpm-lock.yaml' : 'pnpm-lock.yaml'\n      },`
            ],
            [
              `expression.replaceAll('inputs.cache-dependency-path', 'inputs["cache-dependency-path"]')`,
              `expression\n          .replaceAll(\n            'steps.pnpm-store-mode.outputs.lookup-only',\n            'steps["pnpm-store-mode"].outputs["lookup-only"]'\n          )\n          .replaceAll('inputs.cache-dependency-path', 'inputs["cache-dependency-path"]')\n          .replaceAll('inputs.cache-pnpm-store', 'inputs["cache-pnpm-store"]')`
            ]
          ]
          for (const [before, after] of replacements) {
            if (source.split(before).length !== 2) throw new Error(`expected one fixture match: ${'$'}{before}`)
            source = source.replace(before, after)
          }
          fs.writeFileSync(path, source)
          NODE
          test "$(git hash-object "$dependency_cache_fixture")" = \
            3452e99aff2b26a4fe8785a0a94af4bcd620a480
          test "$(git rev-parse "$UPSTREAM_SHA:$pr_parallelism_fixture")" = \
            611dd974b79d1be707b93662da6838053fa3c17f
          test "$(git hash-object "$pr_parallelism_fixture")" = \
            611dd974b79d1be707b93662da6838053fa3c17f
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'config/scripts/pr-workflow-parallelism.test.mjs'
          let source = fs.readFileSync(path, 'utf8')
          const replacements = [
            [
              "github.event_name != 'pull_request' && 'pnpm' || ''",
              "github.event_name != 'pull_request' && inputs.cache-pnpm-store != 'false' && steps.pnpm-store-mode.outputs.lookup-only != 'true' && 'pnpm' || ''"
            ],
            [
              "github.event_name == 'pull_request' && (runner.os != 'Windows' || runner.arch != 'X64' || !contains(inputs.cache-dependency-path, 'mobile/pnpm-lock.yaml'))",
              "github.event_name == 'pull_request' && inputs.cache-pnpm-store != 'false' && !((runner.os == 'Linux' || runner.os == 'macOS') && (runner.arch == 'X64' || runner.arch == 'ARM64') && inputs.cache-dependency-path == 'pnpm-lock.yaml') && (runner.os != 'Windows' || !(runner.arch == 'X64' && contains(inputs.cache-dependency-path, 'mobile/pnpm-lock.yaml')) && !((runner.arch == 'X64' || runner.arch == 'ARM64') && inputs.cache-dependency-path == 'pnpm-lock.yaml'))"
            ]
          ]
          for (const [before, after] of replacements) {
            if (source.split(before).length !== 2) throw new Error(`expected one fixture match: ${before}`)
            source = source.replace(before, after)
          }
          fs.writeFileSync(path, source)
          NODE
          test "$(git hash-object "$pr_parallelism_fixture")" = \
            ee9e63cd4d5e74c5a9bf3c7cb6ce3102616a8d1b
          test "$(git rev-parse "$UPSTREAM_SHA:$native_cache_fixture")" = \
            6851ed62f9ba3575a3555b3e5622395ae8de3c4e
          test "$(git hash-object "$native_cache_fixture")" = \
            6851ed62f9ba3575a3555b3e5622395ae8de3c4e
          test "$(git rev-parse "$UPSTREAM_SHA:$mobile_shell_fixture")" = \
            f6f05c779ebfaf2133d31cb1f9752d598f5fac04
          test "$(git hash-object "$mobile_shell_fixture")" = \
            f6f05c779ebfaf2133d31cb1f9752d598f5fac04
          test "$(git rev-parse "$UPSTREAM_SHA:$release_e2e_fixture")" = \
            2277cd399a491bbddf5041908167976ac217e6e3
          test "$(git hash-object "$release_e2e_fixture")" = \
            2277cd399a491bbddf5041908167976ac217e6e3
          test "$(git rev-parse "$UPSTREAM_SHA:$hostile_hosts_fixture")" = \
            c79706ab4fdb6bd26ca233058d200d1383c91cd8
          test "$(git hash-object "$hostile_hosts_fixture")" = \
            c79706ab4fdb6bd26ca233058d200d1383c91cd8
          node <<'NODE'
          const fs = require('node:fs')
          const expressionOpen = '$' + '{{'
          const repairs = [
            [
              'config/scripts/ci-native-cache.test.mjs',
              [[
                `"inputs.cache-pnpm-verification == 'true'",\n            "inputs.cache-pnpm-verification == 'false'"`,
                `'enabled: ${expressionOpen} inputs.cache-pnpm-verification }}',\n            "enabled: 'false'"`
              ]]
            ],
            [
              'config/scripts/mobile-release-shell-switch-workflow.test.mjs',
              [
                [
                  `  '${expressionOpen} steps.pnpm-store.outputs.path }}',\n`,
                  `  '${expressionOpen} steps.pnpm-store.outputs.path }}',\n  '${expressionOpen} env.ORCA_PNPM_STORE_CACHE_PATH }}',\n`
                ],
                [
                  "github.event_name != 'pull_request' && 'pnpm' || ''",
                  "github.event_name != 'pull_request' && inputs.cache-pnpm-store != 'false' && steps.pnpm-store-mode.outputs.lookup-only != 'true' && 'pnpm' || ''"
                ]
              ]
            ],
            [
              'config/scripts/release-e2e-dispatch-contract.test.mjs',
              [[
                `    expect(dispatchJob.if).toBe("${expressionOpen} needs.cut.outputs.tag != '' }}")`,
                `    expect(dispatchJob.if).toBe(\n      "${expressionOpen} !cancelled() && needs.publish-release.result == 'success' && needs.cut.outputs.tag != '' }}"\n    )`
              ]]
            ],
            [
              'config/scripts/ssh-hostile-hosts-workflow.test.mjs',
              [[
                "const runners = { 'darwin-arm64': 'macos-14', 'darwin-x64': 'macos-15-intel' }",
                "const runners = { 'darwin-arm64': 'macos-15', 'darwin-x64': 'macos-15-intel' }"
              ]]
            ]
          ]
          for (const [path, replacements] of repairs) {
            let source = fs.readFileSync(path, 'utf8')
