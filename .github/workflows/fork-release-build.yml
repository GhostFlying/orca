name: Fork Release Build

on:
  push:
    branches:
      - sync/upstream-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-maintenance
  cancel-in-progress: false

env:
  ANCHOR_BRANCH: upstream-release
  FORK_BRANCH: fork
  PREVIEW_BRANCH: sync/upstream-release

jobs:
  candidate:
    if: github.repository == 'GhostFlying/orca'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      anchor_sha: ${{ steps.inspect.outputs.anchor_sha }}
      candidate_sha: ${{ steps.inspect.outputs.candidate_sha }}
      source_anchor_sha: ${{ steps.inspect.outputs.source_anchor_sha }}
      source_fork_sha: ${{ steps.inspect.outputs.source_fork_sha }}
      state: ${{ steps.refs.outputs.state }}
      upstream_sha: ${{ steps.inspect.outputs.upstream_sha }}
      upstream_tag: ${{ steps.inspect.outputs.upstream_tag }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect candidate transaction
        id: inspect
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node .github/scripts/fork-maintenance-state.mjs inspect-candidate \
            --candidate=HEAD >"$RUNNER_TEMP/fork-candidate.json"
          jq . "$RUNNER_TEMP/fork-candidate.json"
          test "$(jq -r .candidateSha "$RUNNER_TEMP/fork-candidate.json")" = "$EXPECTED_SHA"
          jq -r '
            "anchor_sha=\(.anchorSha)",
            "candidate_sha=\(.candidateSha)",
            "source_anchor_sha=\(.sourceAnchorSha // "")",
            "source_fork_sha=\(.sourceForkSha)",
            "upstream_sha=\(.upstreamSha)",
            "upstream_tag=\(.upstreamTag)"
          ' "$RUNNER_TEMP/fork-candidate.json" >>"$GITHUB_OUTPUT"
          upstream_sha="$(jq -r .upstreamSha "$RUNNER_TEMP/fork-candidate.json")"
          upstream_tag="$(jq -r .upstreamTag "$RUNNER_TEMP/fork-candidate.json")"
          test "$(git show -s --format=%s "$upstream_sha")" = "release: $upstream_tag"
          test "v$(git show "$upstream_sha:package.json" | jq -r .version)" = "$upstream_tag"
      - name: Verify current transaction refs
        id: refs
        env:
          ANCHOR_SHA: ${{ steps.inspect.outputs.anchor_sha }}
          CANDIDATE_SHA: ${{ steps.inspect.outputs.candidate_sha }}
          SOURCE_ANCHOR_SHA: ${{ steps.inspect.outputs.source_anchor_sha }}
          SOURCE_FORK_SHA: ${{ steps.inspect.outputs.source_fork_sha }}
        run: |
          set -euo pipefail
          remote_ref() { git ls-remote origin "refs/heads/$1" | awk '{print $1}'; }
          current_anchor="$(remote_ref "$ANCHOR_BRANCH")"
          current_fork="$(remote_ref "$FORK_BRANCH")"
          current_preview="$(remote_ref "$PREVIEW_BRANCH")"
          test "$current_preview" = "$CANDIDATE_SHA"
          if [[ "$current_fork" = "$SOURCE_FORK_SHA" && "$current_anchor" = "$SOURCE_ANCHOR_SHA" ]]; then
            echo "state=pending" >>"$GITHUB_OUTPUT"
          elif [[ "$current_fork" = "$CANDIDATE_SHA" && "$current_anchor" = "$ANCHOR_SHA" ]]; then
            echo "state=promoted" >>"$GITHUB_OUTPUT"
          else
            echo "::error::Candidate source leases no longer match the remote refs."
            exit 1
          fi

  maintenance-contract:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Verify fork maintenance contract
        run: |
          node .github/scripts/fork-maintenance-state.mjs inspect-candidate --candidate=HEAD
          pnpm exec vitest run --config .github/scripts/vitest.config.mjs

  lint:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - run: pnpm lint

  typecheck:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - run: pnpm typecheck

  test:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        shard_total: [8]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - run: node config/scripts/install-electron-package-binary.mjs
      - name: Restore upstream workflow fixtures
        env:
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          git checkout "$UPSTREAM_SHA" -- .github/workflows
      - name: Test shard
        run: |
          pnpm exec vitest run --config config/vitest.config.ts \
            --exclude='**/*.live-shell.test.ts' \
            --exclude='**/*.node-pty.test.ts' \
            --exclude=tests/e2e/cross-version-wire/** \
            --shard=${{ matrix.shard }}/${{ matrix.shard_total }}

  cross-version-wire:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - name: Fetch exact upstream Release baseline
        env:
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.candidate.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/stablyai/orca.git \
            "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          test "$(git rev-parse "$UPSTREAM_TAG^{commit}")" = "$UPSTREAM_SHA"
      - run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          tests/e2e/cross-version-wire/cross-version-terminal-wire.unit.test.ts
        env:
          ORCA_CROSS_VERSION_BASELINE_REF: ${{ needs.candidate.outputs.upstream_tag }}

  mobile-checks:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm install --frozen-lockfile
        working-directory: mobile
      - run: pnpm typecheck
        working-directory: mobile
      - run: pnpm test
        working-directory: mobile
      - run: pnpm lint
        working-directory: mobile

  desktop:
    needs: candidate
    name: Desktop ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool rpm
      - name: Build desktop application
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Package unsigned Windows client
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/scripts/fork-electron-builder-config.cjs --win --x64 --publish never
      - name: Package Linux x64 client
        if: matrix.platform == 'linux-x64'
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/scripts/fork-electron-builder-config.cjs --linux AppImage deb rpm --x64 --publish never
      - name: Package Linux arm64 client
        if: matrix.platform == 'linux-arm64'
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          ORCA_LINUX_ARM64_RELEASE=1 pnpm exec electron-builder --config config/scripts/fork-electron-builder-config.cjs --linux AppImage deb rpm --arm64 --publish never
      - name: Package ad-hoc macOS clients
        if: matrix.platform == 'macos'
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --config config/scripts/fork-electron-builder-config.cjs --mac --publish never
      - name: Verify macOS artifacts are not Developer ID signed
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          for app in dist/mac*/Orca.app; do
            details="$(codesign -dv --verbose=4 "$app" 2>&1 || true)"
            if grep -Eq 'Authority=Developer ID Application|TeamIdentifier=[A-Z0-9]+' <<<"$details"; then
              echo "Unexpected trusted macOS signing identity in $app" >&2
              exit 1
            fi
          done
      - name: Stage desktop release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          case "${{ matrix.platform }}" in
            windows-x64) cp dist/orca-windows-setup.exe dist/orca-windows-setup.exe.blockmap dist/latest.yml release-assets/ ;;
            linux-x64) cp dist/*.AppImage dist/*.deb dist/*.rpm dist/latest-linux.yml release-assets/ ;;
            linux-arm64) cp dist/*.AppImage dist/*.deb dist/*.rpm dist/latest-linux-arm64.yml release-assets/ ;;
            macos) cp dist/orca-macos-*.dmg dist/Orca-*-mac.zip dist/latest-mac.yml release-assets/ ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  android:
    needs: candidate
    name: Mobile Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleRelease
      - name: Stage APK
        run: |
          set -euo pipefail
          version="$(node -p "require('./app.json').expo.version")"
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p ../release-assets
          cp "$apk" "../release-assets/orca-mobile-android-${version}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  ios:
    needs: candidate
    name: Mobile iOS unsigned
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx expo prebuild --platform ios --no-install
      - run: npx pod-install ios
      - name: Build unsigned IPA
        run: bash scripts/build-unsigned-ios.sh
      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-ios
          path: mobile/build/unsigned-ios/output/*.ipa
          if-no-files-found: error
          retention-days: 7

  release-bundle:
    needs:
      - candidate
      - desktop
      - android
      - ios
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.assets.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: fork-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release assets
        id: assets
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.candidate.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          export DESKTOP_VERSION="$(node -p "require('./package.json').version")"
          export MOBILE_VERSION="$(node -p "require('./mobile/app.json').expo.version")"
          export ANDROID_VERSION_CODE="$(node -p "require('./mobile/app.json').expo.android.versionCode")"
          export IOS_BUILD_NUMBER="$(node -p "require('./mobile/app.json').expo.ios.buildNumber")"
          node .github/scripts/fork-release-assets.mjs release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-complete
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  finalize:
    needs:
      - candidate
      - maintenance-contract
      - lint
      - typecheck
      - test
      - cross-version-wire
      - mobile-checks
      - desktop
      - android
      - ios
      - release-bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: fork-release-complete
          path: release-assets
      - name: Verify trusted release bundle
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.release-bundle.outputs.release_tag }}
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.candidate.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          jq -e \
            --arg candidate "$CANDIDATE_SHA" \
            --arg tag "$RELEASE_TAG" \
            --arg upstream_sha "$UPSTREAM_SHA" \
            --arg upstream_tag "$UPSTREAM_TAG" \
            '.candidateSha == $candidate and .releaseTag == $tag and .upstream.sha == $upstream_sha and .upstream.tag == $upstream_tag' \
            release-assets/build-metadata.json >/dev/null
          (cd release-assets && sha256sum --check checksums.txt)
      - name: Revalidate exact remote refs
        id: refs
        env:
          ANCHOR_SHA: ${{ needs.candidate.outputs.anchor_sha }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          SOURCE_ANCHOR_SHA: ${{ needs.candidate.outputs.source_anchor_sha }}
          SOURCE_FORK_SHA: ${{ needs.candidate.outputs.source_fork_sha }}
        run: |
          set -euo pipefail
          remote_ref() { git ls-remote origin "refs/heads/$1" | awk '{print $1}'; }
          current_anchor="$(remote_ref "$ANCHOR_BRANCH")"
          current_fork="$(remote_ref "$FORK_BRANCH")"
          current_preview="$(remote_ref "$PREVIEW_BRANCH")"
          test "$current_preview" = "$CANDIDATE_SHA"
          if [[ "$current_fork" = "$SOURCE_FORK_SHA" && "$current_anchor" = "$SOURCE_ANCHOR_SHA" ]]; then
            echo "state=pending" >>"$GITHUB_OUTPUT"
          elif [[ "$current_fork" = "$CANDIDATE_SHA" && "$current_anchor" = "$ANCHOR_SHA" ]]; then
            echo "state=promoted" >>"$GITHUB_OUTPUT"
          else
            echo "::error::Production refs changed while the candidate was building."
            exit 1
          fi
      - name: Create or refresh draft Release
        id: release
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-bundle.outputs.release_tag }}
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.candidate.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/fork-release-notes.md"
          cat >"$notes" <<EOF
          Automated fork build based on upstream $UPSTREAM_TAG ($UPSTREAM_SHA).

          Candidate: $CANDIDATE_SHA

          Desktop and mobile artifacts are published together. They are not uploaded to any app store. macOS is ad-hoc signed and may require a Gatekeeper override. The iOS IPA is unsigned and must be re-signed before installation. Verify downloads with checksums.txt and build-metadata.json.
          EOF
          release_json="$(
            page=1
            while :; do
              values="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page")"
              jq -c '.[]' <<<"$values"
              [[ "$(jq 'length' <<<"$values")" -lt 100 ]] && break
              page=$((page + 1))
            done | jq -sc --arg tag "$RELEASE_TAG" \
              '[.[] | select(.tag_name == $tag)] | if length == 0 then empty elif length == 1 then .[0] else error("duplicate release tag") end'
          )"
          if [[ -z "$release_json" ]]; then
            release_json="$(jq -n \
              --arg tag "$RELEASE_TAG" \
              --arg target "$CANDIDATE_SHA" \
              --arg name "Orca $UPSTREAM_TAG fork build" \
              --rawfile body "$notes" \
              '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: true, prerelease: true, make_latest: "false"}' | \
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input -)"
          fi
          test "$(jq -r .tag_name <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r .prerelease <<<"$release_json")" = true
          release_target="$(jq -r .target_commitish <<<"$release_json")"
          if [[ "$release_target" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Release target $release_target does not match $CANDIDATE_SHA."
            exit 1
          fi
          release_id="$(jq -r .id <<<"$release_json")"
          draft="$(jq -r .draft <<<"$release_json")"
          if [[ "$draft" = true ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --paginate --jq '.[].id' |
            while read -r asset_id; do
              [[ -n "$asset_id" ]] || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          elif [[ "$draft" != false ]]; then
            echo "::error::Release draft state is invalid."
            exit 1
          fi
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"
          echo "was_draft=$draft" >>"$GITHUB_OUTPUT"
      - name: Verify uploaded assets
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-bundle.outputs.release_tag }}
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.candidate.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          remote_dir="$RUNNER_TEMP/remote-release-assets"
          mkdir "$remote_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote_dir"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort >"$RUNNER_TEMP/local-assets.txt"
          find "$remote_dir" -maxdepth 1 -type f -printf '%f\n' | sort >"$RUNNER_TEMP/remote-assets.txt"
          diff -u "$RUNNER_TEMP/local-assets.txt" "$RUNNER_TEMP/remote-assets.txt"
          jq -e \
            --arg candidate "$CANDIDATE_SHA" \
            --arg tag "$RELEASE_TAG" \
            --arg upstream_sha "$UPSTREAM_SHA" \
            --arg upstream_tag "$UPSTREAM_TAG" \
            '.candidateSha == $candidate and .releaseTag == $tag and .upstream.sha == $upstream_sha and .upstream.tag == $upstream_tag' \
            "$remote_dir/build-metadata.json" >/dev/null
          (cd "$remote_dir" && sha256sum --check checksums.txt)
      - name: Atomically promote candidate
        if: steps.refs.outputs.state == 'pending'
        env:
          ANCHOR_SHA: ${{ needs.candidate.outputs.anchor_sha }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          FORK_MAINTENANCE_SSH_KEY: ${{ secrets.FORK_MAINTENANCE_SSH_KEY }}
          SOURCE_ANCHOR_SHA: ${{ needs.candidate.outputs.source_anchor_sha }}
          SOURCE_FORK_SHA: ${{ needs.candidate.outputs.source_fork_sha }}
        run: |
          set -euo pipefail
          test -n "$FORK_MAINTENANCE_SSH_KEY"
          key_path="$RUNNER_TEMP/fork-maintenance-key"
          known_hosts_path="$RUNNER_TEMP/fork-maintenance-known-hosts"
          printf '%s\n' "$FORK_MAINTENANCE_SSH_KEY" >"$key_path"
          chmod 600 "$key_path"
          ssh-keyscan -t ed25519 github.com >"$known_hosts_path" 2>/dev/null
          test "$(ssh-keygen -lf "$known_hosts_path" -E sha256 | awk '{print $2}')" = \
            'SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU'
          GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts_path" \
            git push --atomic \
              --force-with-lease="refs/heads/$FORK_BRANCH:$SOURCE_FORK_SHA" \
              --force-with-lease="refs/heads/$ANCHOR_BRANCH:$SOURCE_ANCHOR_SHA" \
              --force-with-lease="refs/heads/$PREVIEW_BRANCH:$CANDIDATE_SHA" \
              "git@github.com:$GITHUB_REPOSITORY.git" \
              "$CANDIDATE_SHA:refs/heads/$FORK_BRANCH" \
              "$ANCHOR_SHA:refs/heads/$ANCHOR_BRANCH" \
              "$CANDIDATE_SHA:refs/heads/$PREVIEW_BRANCH"
      - name: Publish complete fork Release
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.release-bundle.outputs.release_tag }}
        run: |
          set -euo pipefail
          remote_ref() { git ls-remote origin "refs/heads/$1" | awk '{print $1}'; }
          test "$(remote_ref "$FORK_BRANCH")" = "$CANDIDATE_SHA"
          test "$(remote_ref "$PREVIEW_BRANCH")" = "$CANDIDATE_SHA"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)" = true ]]; then
            jq -n '{draft: false, prerelease: true, make_latest: "false"}' | \
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input - >/dev/null
          fi
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          jq -e \
            --arg candidate "$CANDIDATE_SHA" \
            --arg tag "$RELEASE_TAG" \
            '.draft == false and .prerelease == true and .tag_name == $tag and .target_commitish == $candidate' \
            <<<"$release_json" >/dev/null
          tag_sha=
          for _ in {1..5}; do
            tag_sha="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
            [[ "$tag_sha" = "$CANDIDATE_SHA" ]] && break
            sleep 2
          done
          test "$tag_sha" = "$CANDIDATE_SHA"
